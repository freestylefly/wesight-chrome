name: Release browser extensions

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test, build, and package
        run: pnpm check && pnpm package

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.RELEASE_TAG !== 'v' + pkg.version)
          throw new Error('Tag must equal v' + pkg.version);"

      - name: Prepare stable download names
        run: |
          cp build/chrome-mv3-prod.zip build/wesight-chrome.zip
          cp build/edge-mv3-prod.zip build/wesight-edge.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_args=(--generate-notes)
          if [ -f "docs/releases/${GITHUB_REF_NAME#v}.md" ]; then
            notes_args=(--notes-file "docs/releases/${GITHUB_REF_NAME#v}.md")
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            "${notes_args[@]}" \
            build/wesight-chrome.zip \
            build/wesight-edge.zip
