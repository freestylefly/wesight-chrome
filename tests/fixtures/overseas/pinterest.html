<!doctype html>
<html>
  <body>
    <main>
      <div class="upload">
        <input id="storyboard-upload-input" type="file" accept="image/bmp,image/jpeg,image/png,image/webp,video/mp4" aria-label="File upload">
        <div class="upload-preview"></div>
      </div>
      <form>
        <input id="storyboard-selector-title" placeholder="Add a title" disabled>
        <div contenteditable="true" role="combobox" aria-label="Add a detailed description"></div>
        <input placeholder="Add a link">
        <button type="button">Choose a board</button>
      </form>
      <button type="button">Publish</button>
    </main>
  </body>
</html>
