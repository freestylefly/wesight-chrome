<!doctype html>
<html>
<body>
<main>
  <section>
    <input type="file" accept="image/jpeg,image/png,image/gif" multiple>
    <div class="previews"></div>
  </section>
  <textarea placeholder="填写标题" data-testid="title"></textarea>
  <div contenteditable="true" data-placeholder="填写描述信息，让大家了解更多内容" data-testid="editor"></div>
  <button type="button">保存为草稿</button>
  <button type="button" class="publish">发表</button>
</main>
</body>
</html>
