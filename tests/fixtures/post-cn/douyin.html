<!doctype html>
<html>
<body>
<main>
  <div class="tabs"><div>发布视频</div><div data-reveals=".upload">发布图文</div></div>
  <section class="upload" hidden>
    <input type="file" accept="image/png,image/jpeg,image/webp" multiple data-reveals=".form">
    <div class="previews"></div>
  </section>
  <section class="form" hidden>
    <input placeholder="添加作品标题" data-testid="title">
    <div contenteditable="true" data-placeholder="添加作品描述..." data-testid="editor"></div>
    <button type="button" class="publish">发布</button>
  </section>
</main>
</body>
</html>
